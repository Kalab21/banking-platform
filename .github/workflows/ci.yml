name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and verify all modules
        run: mvn -B --no-transfer-progress clean verify

      - name: Validate Docker Compose files
        env:
          # The stack requires JWT_SECRET and has no default, so interpolation
          # fails without one. This value only satisfies the config parser; it
          # signs nothing and starts nothing.
          JWT_SECRET: ci-config-validation-placeholder-not-a-signing-key
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.infra.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev-ports.yml config --quiet
          docker compose -f docker-compose.observability.yml config --quiet

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Offline suite only: it stubs the gateway by pointing at a dead port, so it
      # needs no backend. The live suite requires all 13 services and is run
      # manually — see the README.
      - name: End-to-end tests (offline)
        run: npm run test:e2e

  terraform:
    name: Terraform (AWS model)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/aws

    # Static checks only: no backend, no plan, no apply, no AWS credentials.
    # The tests run against mocked providers (tests/architecture.tftest.hcl).
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Architecture invariants (mocked providers)
        run: terraform test
