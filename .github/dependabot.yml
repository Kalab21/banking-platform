version: 2

# Weekly rather than daily, and grouped rather than one PR per bump.
# An unattended portfolio repository that opens fifteen separate dependency PRs
# a week reads as abandoned, not maintained.

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    groups:
      # Routine version drift arrives as one reviewable PR.
      maven-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Framework majors are pinned deliberately, not neglected. This project
      # targets Spring Boot 3.3 on Java 17; a Boot 4 or Spring Cloud 2025 bump
      # is a migration with its own design work, not a dependency update, and
      # Dependabot proposing one every week is noise that trains you to ignore
      # the PRs that do matter.
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.cloud:spring-cloud-dependencies"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Tied to the Next.js 16 / React 19 toolchain. These move when the
      # framework moves, not independently.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    # The one Dockerfile all thirteen services share.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 2
    labels: [dependencies, docker]
    ignore:
      # The services are built for Java 17. Moving the JRE major is a runtime
      # decision that belongs with a toolchain change, not a weekly bump.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(deps)"
