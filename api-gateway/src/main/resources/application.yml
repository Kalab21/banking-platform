server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"
      discovery:
        locator:
          # Off deliberately. When enabled the gateway auto-creates a
          # /{service-id}/** route for every registered service, which would
          # expose paths the explicit routes below do not — including
          # /account-service/internal/accounts/{id}/balance, defeating the
          # internal-only boundary. Routes are declared explicitly instead, so
          # the public surface is exactly what is listed here.
          enabled: false
          lower-case-service-id: true
      routes:
        - id: user-service-auth
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: application-service
          uri: lb://application-service
          predicates:
            - Path=/api/applications/**
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/accounts/**
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
        - id: statistics-service
          uri: lb://statistics-service
          predicates:
            - Path=/api/statistics/**
        - id: fraud-detection-service
          uri: lb://fraud-detection-service
          predicates:
            - Path=/api/fraud/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
        - id: credit-card-service
          uri: lb://credit-card-service
          predicates:
            - Path=/api/credit-cards/**
        - id: loan-service
          uri: lb://loan-service
          predicates:
            - Path=/api/loans/**
        - id: integration-service
          uri: lb://integration-service
          predicates:
            - Path=/api/integrations/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        # Only these three. Metrics and tracing add no new public surface:
        # everything else (env, beans, heapdump, loggers...) stays closed.
        include: health,info,prometheus,gateway
  endpoint:
    health:
      # Liveness/readiness are derived from Spring's own application state and
      # the registered health indicators, so Compose and any orchestrator can
      # tell "process is up" from "ready for traffic".
      probes:
        enabled: true
      # Dependency detail is internal; callers get UP/DOWN only.
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      # Every series is labelled with its service, so one Prometheus scrape
      # config and one Grafana dashboard can break down by service.
      application: ${spring.application.name}
    distribution:
      # Without histogram buckets Prometheus cannot compute a latency
      # quantile at all, so the p95/p99 panels would be permanently empty.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    baggage:
      # The correlation id rides with the trace context rather than the MDC.
      # Spring Cloud CircuitBreaker can run a Feign call on a different thread,
      # where a thread-local MDC lookup silently finds nothing; baggage crosses
      # that hop and the service boundary with the trace itself.
      remote-fields:
        - X-Request-Id
      correlation:
        enabled: true
        fields:
          - X-Request-Id
    sampling:
      # Full sampling: this is a demo stack, and a trace you cannot find is
      # worse than no tracing. A real deployment would sample well below 1.0.
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

jwt:
  # No default. A committed fallback is a publicly known signing key, and any
  # deployment that kept it would accept tokens forged by anyone who has read
  # this repository. The service fails to start without JWT_SECRET, which is
  # the intended behaviour: refusing to run is safer than running forgeable.
  #
  # The gateway and user-service must be given the *same* value — one issues
  # tokens, the other verifies them.
  secret: ${JWT_SECRET}

logging:
  pattern:
    # Every line carries who logged it and which request it belongs to.
    # requestId is the id a caller can quote; traceId/spanId are Micrometer's
    # and are what Zipkin indexes. Boot splices this into its console pattern.
    correlation: "[${spring.application.name:-},%X{X-Request-Id:-},%X{traceId:-},%X{spanId:-}] "
