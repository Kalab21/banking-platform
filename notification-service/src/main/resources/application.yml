server:
  port: 8087

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: bankingadmin
    password: bankingpass
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer wraps the JSON one. Without it, a payload
      # that cannot be deserialized fails before the listener is ever called,
      # so the error handler never sees the record and the container retries
      # the same offset forever — one malformed byte stops the partition for
      # good. Wrapped, the failure becomes a record the error handler can
      # route to the dead letter topic.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        # Deserialize every record on these topics as a DomainEvent and let
        # @JsonTypeInfo route on the eventType field. An unrecognised type
        # becomes UnknownEvent rather than throwing, so a service can publish
        # a new event without poisoning the partition for consumers that have
        # not been redeployed.
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.bankingplatform.common.events.DomainEvent
        # Narrowed from "*": only the contract package may be instantiated.
        spring.json.trusted.packages: "com.bankingplatform.common.events"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # The wire contract is the eventType field, not a Java class name.
        # With type headers on, Jackson would write the producer's FQCN into
        # __TypeId__ and the consumer would instantiate whatever class that
        # names — which makes a package rename a breaking protocol change, and
        # pairs badly with a permissive trusted-packages list. Routing is done
        # by @JsonTypeInfo on DomainEvent instead.
        spring.json.add.type.headers: false
        max.block.ms: 1000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        # Only these three. Metrics and tracing add no new public surface:
        # everything else (env, beans, heapdump, loggers...) stays closed.
        include: health,info,prometheus
  endpoint:
    health:
      # Liveness/readiness are derived from Spring's own application state and
      # the registered health indicators, so Compose and any orchestrator can
      # tell "process is up" from "ready for traffic".
      probes:
        enabled: true
      # Dependency detail is internal; callers get UP/DOWN only.
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      # Every series is labelled with its service, so one Prometheus scrape
      # config and one Grafana dashboard can break down by service.
      application: ${spring.application.name}
    distribution:
      # Without histogram buckets Prometheus cannot compute a latency
      # quantile at all, so the p95/p99 panels would be permanently empty.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    baggage:
      # The correlation id rides with the trace context rather than the MDC.
      # Spring Cloud CircuitBreaker can run a Feign call on a different thread,
      # where a thread-local MDC lookup silently finds nothing; baggage crosses
      # that hop and the service boundary with the trace itself.
      remote-fields:
        - X-Request-Id
      correlation:
        enabled: true
        fields:
          - X-Request-Id
    sampling:
      # Full sampling: this is a demo stack, and a trace you cannot find is
      # worse than no tracing. A real deployment would sample well below 1.0.
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    # Every line carries who logged it and which request it belongs to.
    # requestId is the id a caller can quote; traceId/spanId are Micrometer's
    # and are what Zipkin indexes. Boot splices this into its console pattern.
    correlation: "[${spring.application.name:-},%X{X-Request-Id:-},%X{traceId:-},%X{spanId:-}] "
