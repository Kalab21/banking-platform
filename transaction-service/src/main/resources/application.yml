server:
  port: 8084

spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:postgresql://localhost:5432/transaction_db
    username: bankingadmin
    password: bankingpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # The wire contract is the eventType field, not a Java class name.
        # With type headers on, Jackson would write the producer's FQCN into
        # __TypeId__ and the consumer would instantiate whatever class that
        # names — which makes a package rename a breaking protocol change, and
        # pairs badly with a permissive trusted-packages list. Routing is done
        # by @JsonTypeInfo on DomainEvent instead.
        spring.json.add.type.headers: false
        max.block.ms: 1000
        request.timeout.ms: 1000
    consumer:
      group-id: transaction-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.bankingplatform.*"

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 15000
          # Tighter than the default for the one hop that sits inside a money
          # movement. A caller waiting on a transfer should be told the system
          # is struggling in seconds, not after fifteen.
          account-service:
            connectTimeout: 2000
            readTimeout: 5000
      circuitbreaker:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        # Only these three. Metrics and tracing add no new public surface:
        # everything else (env, beans, heapdump, loggers...) stays closed.
        include: health,info,prometheus
  endpoint:
    health:
      # Liveness/readiness are derived from Spring's own application state and
      # the registered health indicators, so Compose and any orchestrator can
      # tell "process is up" from "ready for traffic".
      probes:
        enabled: true
      # Dependency detail is internal; callers get UP/DOWN only.
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      # Every series is labelled with its service, so one Prometheus scrape
      # config and one Grafana dashboard can break down by service.
      application: ${spring.application.name}
    distribution:
      # Without histogram buckets Prometheus cannot compute a latency
      # quantile at all, so the p95/p99 panels would be permanently empty.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    baggage:
      # The correlation id rides with the trace context rather than the MDC.
      # Spring Cloud CircuitBreaker can run a Feign call on a different thread,
      # where a thread-local MDC lookup silently finds nothing; baggage crosses
      # that hop and the service boundary with the trace itself.
      remote-fields:
        - X-Request-Id
      correlation:
        enabled: true
        fields:
          - X-Request-Id
    sampling:
      # Full sampling: this is a demo stack, and a trace you cannot find is
      # worse than no tracing. A real deployment would sample well below 1.0.
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    # Every line carries who logged it and which request it belongs to.
    # requestId is the id a caller can quote; traceId/spanId are Micrometer's
    # and are what Zipkin indexes. Boot splices this into its console pattern.
    correlation: "[${spring.application.name:-},%X{X-Request-Id:-},%X{traceId:-},%X{spanId:-}] "

# ---------------------------------------------------------------------------
# Resilience for transaction-service -> account-service ONLY.
#
# This is the single synchronous hop that debits and credits balances, so a
# slow or dead account-service otherwise ties up transaction-service threads
# and turns one failure into two. No other Feign path in the platform is
# protected; see "Known limitations" in the README.
#
# There is deliberately NO retry. `updateBalance` is not idempotent and
# carries no idempotency key, so a retry after a timeout could debit an
# account twice — the request may well have succeeded and only the response
# been lost. Failing fast and surfacing the error is the safe choice until
# idempotency keys exist.
# ---------------------------------------------------------------------------
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        # A rejected debit is account-service working correctly, not failing.
        # Without this, a run of insufficient-funds responses would open the
        # breaker and take down transfers for everyone.
        ignore-exceptions:
          - feign.FeignException$BadRequest
          - feign.FeignException$NotFound
          - feign.FeignException$Conflict
          - feign.FeignException$UnprocessableEntity
    instances:
      # transaction-service has exactly one Feign client, so the default
      # config above is the account-service policy. Naming it here keeps the
      # intent obvious in the actuator health output.
      account-service:
        base-config: default

  timelimiter:
    configs:
      default:
        # Spring Cloud CircuitBreaker wraps every call in a TimeLimiter whose
        # default is ONE SECOND. That is shorter than a healthy debit takes on
        # a cold JVM, so leaving it at the default turned ordinary transfers
        # into timeouts. Set just above the Feign read timeout (5s) so Feign
        # reports a slow downstream first and this stays the outer backstop.
        timeout-duration: 6s
        # The Feign call must be interruptible for the timeout to mean
        # anything.
        cancel-running-future: true
    instances:
      account-service:
        base-config: default

