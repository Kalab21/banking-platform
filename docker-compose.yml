name: banking-platform

# Full stack — all services + infra
# Prerequisites: mvn package -DskipTests (from root)
# Usage: docker compose up -d
#
# Application traffic enters through the gateway. The business services
# deliberately publish no host ports: they are reachable only on the Compose
# network, which is what makes the /internal endpoints internal and stops the
# gateway's authentication being bypassable by calling a service directly.
#
# Ports that are published, and why:
#   frontend      3000  the console
#   api-gateway   8080  the only public API entry point
#   eureka-server 8761  service-registry dashboard (operator view)
#   kafka-ui      8095  topic browser (development tool)
#   postgres/kafka/redis  infrastructure, for IDE-based development
#
# To reach a single service directly while developing, use the override:
#   docker compose -f docker-compose.yml -f docker-compose.dev-ports.yml up -d
#
# JWT_SECRET must be set before starting the stack. There is no default signing
# key: copy .env.example to .env and generate one, for example
#   openssl rand -base64 48

services:

  # ── INFRASTRUCTURE ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: banking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bankingadmin
      POSTGRES_PASSWORD: bankingpass
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankingadmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: banking-kafka
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: banking-kafka-ui
    restart: unless-stopped
    ports:
      - "8095:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: banking-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── SERVICE REGISTRY ──────────────────────────────────────────────────────

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: ../Dockerfile
    container_name: banking-eureka
    environment:
      ZIPKIN_ENDPOINT: http://banking-zipkin:9411/api/v2/spans
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── API GATEWAY ───────────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: ../Dockerfile
    container_name: banking-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Required. Compose fails with this message rather than starting a
      # service that cannot verify a token. Both services must share it.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — copy .env.example and generate a value}
      ZIPKIN_ENDPOINT: http://banking-zipkin:9411/api/v2/spans
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  # ── MICROSERVICES ─────────────────────────────────────────────────────────

  user-service:
    build:
      context: ./user-service
      dockerfile: ../Dockerfile
    container_name: banking-user-service
    restart: unless-stopped
    environment:
      # Required. Compose fails with this message rather than starting a
      # service that cannot verify a token. Both services must share it.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — copy .env.example and generate a value}
      ZIPKIN_ENDPOINT: http://banking-zipkin:9411/api/v2/spans
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: bankingadmin
      SPRING_DATASOURCE_PASSWORD: bankingpass
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Failed sign-in attempts are counted per account here, so this service
      # needs the same Redis the gateway already uses for its per-IP limit.
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # A staff account for this stack, so the controls that are not the
      # customer's can actually be demonstrated and tested: reviewing a referred
      # application, completing a KYC check, simulating a card purchase.
      #
      # Local only. The service creates nothing unless this is true, and this
      # file is the only place it is set. The password is as synthetic as the
      # rest of the demo data and sits beside the database password that has
      # always been here — which is the convention for a repository meant to be
      # read and run locally, and not a pattern for anything deployed.
      NORTHBANK_DEMO_STAFF_ENABLED: "true"
      NORTHBANK_DEMO_STAFF_USERNAME: northbank.reviewer
      NORTHBANK_DEMO_STAFF_PASSWORD: ReviewerDemo2026!
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  account-service:
