<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1060" width="1400" height="1060" role="img" aria-label="Northbank AWS reference deployment, drawn from the Terraform in infrastructure/aws and not currently deployed. Clients resolve the API name through Route 53 to CloudFront, which has AWS WAF attached and terminates TLS with an ACM certificate. CloudFront forwards over HTTPS only to an internet-facing Application Load Balancer in the public subnets, which redirects HTTP to HTTPS and forwards to the API gateway task over HTTP. The gateway, Eureka and eleven business services run as ECS Fargate tasks in private subnets without public IPs. They reach RDS PostgreSQL over JDBC, ElastiCache Redis, and Amazon MSK, whose client-to-broker traffic is TLS. Images come from ECR; secrets from Secrets Manager; logs go to CloudWatch; MSK data at rest uses a KMS key; a NAT gateway provides egress.">
