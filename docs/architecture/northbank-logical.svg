<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1210" width="1400" height="1210" role="img" aria-label="Northbank logical architecture. Customers and staff use a browser that talks only to the Next.js backend-for-frontend, which keeps the JWT in an httpOnly cookie and calls the API gateway server-side. The Spring Cloud Gateway validates the JWT, overwrites the X-User identity headers, rate-limits with Redis and discovers services through Eureka. Eleven Spring Boot services sit on a private network, grouped by domain: identity (user), accounts and money movement (account, transaction, payment, integration), lending and cards (application, loan, credit-card), and risk and insight (fraud-detection, statistics, notification). Authoritative operations are synchronous REST calls into account-service; derived workflows consume Kafka events published through a transactional outbox. Each service owns its own PostgreSQL database; Redis holds rate limits, login throttling, fraud velocity counters and the statistics cache. Prometheus, Grafana, Zipkin and CI with CodeQL and Trivy run across the platform.">
